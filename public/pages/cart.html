<body>

<nav class="navbar" id="navbar">
  <div class="nav-container">
    <a href="/" class="nav-logo">
      <img src="../images/logo.jpeg" alt="Sakhi" class="logo-img"/>
      <span class="brand-name">sakhi.co</span>
    </a>
    <ul class="nav-links" id="navLinks">
      <li><a href="/">Home</a></li>
      <li><a href="/pages/collections.html">Collections</a></li>
      <li><a href="/pages/about.html">About</a></li>
      <li><a href="/pages/contact.html">Contact</a></li>
    </ul>
    <div class="nav-actions">
      <button class="icon-btn" onclick="location.href='/pages/cart.html'" style="position:relative">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>

        <span class="cart-badge">0</span>

</nav>

<div class="page-hero" style="padding:120px 2rem 3rem">
  <p class="hero-eyebrow">Shopping</p>
  <h1>Your Cart</h1>
</div>

<div class="container">
  <div class="cart-layout" id="cartLayout">
    <div id="cartItems"></div>
    <div class="cart-summary" id="cartSummary" style="display:none">
      <h3>Order Summary</h3>
      <div class="summary-row"><span>Subtotal</span><span id="cartSubtotal">₹0</span></div>
      <div class="summary-row"><span>Shipping</span><span style="color:#2D8A4E">FREE</span></div>
      <div class="summary-row total"><span>Total</span><span id="cartTotal">₹0</span></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:1.5rem" onclick="location.href='/pages/checkout.html'">
        Proceed to Checkout →
      </button>
      <a href="/pages/collections.html" style="display:block;text-align:center;margin-top:1rem;color:var(--text-light);font-size:.875rem">
        ← Continue Shopping
      </a>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:1px solid rgba(255,255,255,.1);padding-top:1.25rem">
      <p>© 2026 Sakhi.co</p><p>Made with ❤️ in India</p>
    </div>
  </div>
</footer>

<script src="../js/config.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/main.js"></script>
<script>
function renderCart() {
  const cart = getCart();
  const itemsEl = document.getElementById('cartItems');
  const summaryEl = document.getElementById('cartSummary');

  if (cart.length === 0) {
    itemsEl.innerHTML = `
      <div class="empty-state" style="background:white;border-radius:20px;padding:4rem 2rem">
        <p>🛍️</p>
        <h3 style="font-family:var(--font-display);color:var(--maroon-dark);margin-bottom:.75rem">Your cart is empty</h3>
        <p style="color:var(--text-light);margin-bottom:2rem">Discover beautiful kurtis made just for you</p>
        <a href="/pages/collections.html" class="btn btn-primary">Shop Now</a>
      </div>`;
    summaryEl.style.display = 'none';
    return;
  }

  itemsEl.innerHTML = cart.map(item => `
    <div class="cart-item">
      <div class="cart-item-img">
        ${item.image ? `<img src="${item.image}" alt="${item.name}" style="width:100%;height:100%;object-fit:cover;border-radius:10px"/>` : '👗'}
      </div>
      <div style="flex:1">
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-meta">Size: ${item.size}</div>
        <div class="cart-item-price">₹${item.price}</div>
        <div class="qty-control">
          <button class="qty-btn" onclick="changeQty('${item.product_id}','${item.size}',-1)">−</button>
          <span style="font-weight:600;min-width:20px;text-align:center">${item.quantity}</span>
          <button class="qty-btn" onclick="changeQty('${item.product_id}','${item.size}',1)">+</button>
          <button class="remove-btn" onclick="deleteItem('${item.product_id}','${item.size}')">Remove</button>
        </div>
      </div>
      <div style="font-weight:700;color:var(--maroon);font-size:1rem">₹${item.price * item.quantity}</div>
    </div>`).join('');

  const total = cartTotal();
  document.getElementById('cartSubtotal').textContent = `₹${total}`;
  document.getElementById('cartTotal').textContent = `₹${total}`;
  summaryEl.style.display = 'block';
}

function changeQty(productId, size, delta) {
  const cart = getCart();
  const item = cart.find(i => i.product_id === productId && i.size === size);
  if (!item) return;
  item.quantity += delta;
  if (item.quantity <= 0) {
    const newCart = cart.filter(i => !(i.product_id === productId && i.size === size));
    saveCart(newCart);
  } else {
    saveCart(cart);
  }
  renderCart();
}

function deleteItem(productId, size) {
  removeFromCart(productId, size);
  renderCart();
}

document.addEventListener('DOMContentLoaded', renderCart);
</script>
<!-- BACK TO TOP -->
<button id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})"
  style="display:none;position:fixed;bottom:2rem;right:2rem;width:46px;height:46px;border-radius:50%;background:var(--maroon);color:white;border:none;cursor:pointer;font-size:1.2rem;box-shadow:var(--shadow-lg);z-index:400;align-items:center;justify-content:center;transition:all .3s">
  ↑
</button>
<script>
window.addEventListener('scroll', () => {
  const btn = document.getElementById('backToTop');
  if (btn) btn.style.display = window.scrollY > 400 ? 'flex' : 'none';
});
</script>
</body>
</html>
