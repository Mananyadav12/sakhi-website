<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Product – Sakhi.co</title>
<meta name="description" content="Shop handcrafted pure cotton kurtis at Sakhi.co. Starting ₹649. Free shipping above ₹999."/>
<link rel="stylesheet" href="../css/style.css"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
</head>
<body>

<nav class="navbar" id="navbar">
  <div class="nav-container">
    <a href="/" class="nav-logo">
      <img src="../images/logo.jpeg" alt="Sakhi" class="logo-img"/>
      <span class="brand-name">sakhi.co</span>
    </a>
    <ul class="nav-links" id="navLinks">
      <li><a href="/">Home</a></li>
      <li><a href="/pages/collections.html">Collections</a></li>
      <li><a href="/pages/about.html">About</a></li>
      <li><a href="/pages/contact.html">Contact</a></li>
    </ul>
    <div class="nav-actions">
      <button class="icon-btn" onclick="location.href='/pages/cart.html'" style="position:relative">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <span class="cart-badge">0</span>
      </button>
      <div id="authBtn"></div>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </div>
  </div>
</nav>

<div class="container" style="padding-top:90px">
  <div id="productDetail">
    <div class="product-detail-grid">
      <div class="skeleton" style="aspect-ratio:3/4;border-radius:20px"></div>
      <div style="padding-top:1rem">
        <div class="skeleton" style="height:40px;width:60%;border-radius:8px;margin-bottom:1rem"></div>
        <div class="skeleton" style="height:24px;width:40%;border-radius:8px;margin-bottom:2rem"></div>
        <div class="skeleton" style="height:120px;border-radius:8px"></div>
      </div>
    </div>
  </div>
  <div id="reviewsSection"></div>
</div>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:1px solid rgba(255,255,255,.1);padding-top:1.25rem">
      <p>© 2026 Sakhi.co</p><p>Made with ❤️ in India</p>
    </div>
  </div>
</footer>

<script src="../js/config.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/main.js"></script>
<script src="../js/auth.js"></script>
<script>
let currentProduct = null;
let selectedSize = null;
let currentProductId = null;

async function loadProduct() {
  const id = new URLSearchParams(window.location.search).get('id');
  if (!id) { location.href = '/pages/collections.html'; return; }
  currentProductId = id;

  try {
    const res = await fetch(`${API_URL}/api/products/${id}`);
    const data = await res.json();
    currentProduct = data.product;
    document.title = `${currentProduct.name} – Sakhi.co`;
    renderProduct(currentProduct);
    // Recently viewed mein add karo
    addToRecentlyViewed(currentProduct);
    loadReviews(id);
  } catch (err) {
    document.getElementById('productDetail').innerHTML =
      `<p style="text-align:center;padding:4rem;color:var(--text-light)">Product not found.</p>`;
  }
}

function renderProduct(p) {
  const discount = p.mrp > p.price ? Math.round(((p.mrp - p.price) / p.mrp) * 100) : 0;
  const sizeStock = p.size_stock || {};
  const availableSizes = p.sizes || ['S','M','L','XL','XXL'];
  const allSizes = ['XS','S','M','L','XL','XXL','3XL','4XL'];

  const hasSizeStock = Object.keys(sizeStock).length > 0;
  const totalStock = Object.values(sizeStock).reduce((sum, qty) => sum + qty, 0);
  const isSoldOut = hasSizeStock && totalStock === 0;

  const imgHTML = p.images && p.images.length > 0
    ? `<img src="${p.images[0]}" alt="${p.name}" class="detail-main-img"
        onerror="this.parentElement.innerHTML='<div class=detail-img-placeholder>👗</div>'"/>`
    : `<div class="detail-img-placeholder">👗</div>`;

  let sizesHTML = '';
  if (isSoldOut) {
    sizesHTML = `
      <div style="background:#f8d7da;border:1px solid #f5c6cb;border-radius:12px;padding:14px;text-align:center;margin:1rem 0">
        <span style="color:#58151c;font-weight:700;font-size:1.1rem">❌ Sold Out</span>
        <p style="color:#58151c;font-size:.8rem;margin-top:.25rem">This product is currently unavailable</p>
      </div>`;
  } else {
    const sizesToShow = hasSizeStock
      ? allSizes.filter(s => sizeStock.hasOwnProperty(s))
      : availableSizes;

    sizesHTML = `
      <p class="size-label" style="font-size:.85rem;font-weight:600;color:var(--text-mid);margin-bottom:.75rem">
        Select Size: ${selectedSize ? `<span style="color:var(--maroon);font-weight:700">${selectedSize}</span>` : ''}
      </p>
      <div class="size-options" style="display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:.75rem">
        ${sizesToShow.map(s => {
          const qty = sizeStock[s];
          const isUnavailable = hasSizeStock && qty === 0;
          const isLow = hasSizeStock && qty > 0 && qty <= 5;
          return `
            <button
              class="size-btn ${isUnavailable ? 'out-of-stock' : ''} ${selectedSize === s ? 'selected' : ''}"
              onclick="${isUnavailable ? '' : `selectSize('${s}', this)`}"
              ${isUnavailable ? 'disabled' : ''}
              style="position:relative;${isUnavailable ? 'opacity:.45;cursor:not-allowed;text-decoration:line-through;background:var(--cream-dark);' : ''}">
              ${s}
              ${isLow ? `<span style="position:absolute;top:-8px;right:-4px;background:#e67e22;color:#fff;font-size:.58rem;padding:1px 5px;border-radius:10px;font-weight:700;white-space:nowrap">Low</span>` : ''}
              ${isUnavailable ? `<span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#c0392b;font-size:1.2rem;pointer-events:none">✕</span>` : ''}
            </button>`;
        }).join('')}
      </div>
      <a href="/pages/size-chart.html" style="font-size:.78rem;color:var(--maroon);text-decoration:none;display:inline-block;margin-bottom:1.25rem">
        📏 Size Chart →
      </a>`;
  }

  document.getElementById('productDetail').innerHTML = `
    <div class="product-detail-grid">
      <div class="detail-images">
        ${imgHTML}
        ${p.images && p.images.length > 1 ? `
        <div style="display:flex;gap:.75rem;margin-top:.75rem;flex-wrap:wrap">
          ${p.images.map((img, i) => `
            <img src="${img}" alt="${p.name} ${i+1}"
              style="width:72px;height:90px;object-fit:cover;border-radius:10px;cursor:pointer;border:2px solid ${i===0?'var(--maroon)':'transparent'};transition:border .2s"
              onclick="document.querySelector('.detail-main-img').src='${img}';this.parentElement.querySelectorAll('img').forEach(el=>el.style.borderColor='transparent');this.style.borderColor='var(--maroon)'"/>
          `).join('')}
        </div>` : ''}
      </div>

      <div class="detail-info">
        <p style="color:var(--text-light);font-size:.8rem;margin-bottom:.4rem;text-transform:capitalize;letter-spacing:.5px">
          ${p.category} Kurti
        </p>
        <h1 style="font-family:var(--font-display);font-size:clamp(1.6rem,3vw,2.2rem);color:var(--maroon-dark);margin-bottom:.75rem;line-height:1.2">
          ${p.name}
        </h1>

        <div style="display:flex;align-items:center;gap:12px;margin-bottom:1.25rem;flex-wrap:wrap">
          <span style="font-size:1.8rem;font-weight:700;color:var(--maroon)">₹${p.price}</span>
          ${p.mrp ? `<span style="font-size:1rem;color:var(--text-light);text-decoration:line-through">₹${p.mrp}</span>` : ''}
          ${discount > 0 ? `<span style="background:#e8f5ed;color:#2D8A4E;font-size:.85rem;font-weight:700;padding:4px 10px;border-radius:20px">${discount}% off</span>` : ''}
        </div>

        <p style="color:var(--text-mid);line-height:1.75;margin-bottom:1.5rem;font-size:.95rem">
          ${p.description || 'Beautiful handcrafted kurti in 100% pure cotton. Made with love by skilled artisans.'}
        </p>

        ${sizesHTML}

        ${!isSoldOut ? `
        <p style="font-size:.8rem;margin-bottom:1.5rem;${totalStock > 0 && totalStock <= 10 ? 'color:#e67e22;font-weight:600' : 'color:#2D8A4E'}">
          ${hasSizeStock
            ? (totalStock > 10 ? '✅ In Stock' : totalStock > 0 ? `⚠️ Only ${totalStock} pieces left!` : '')
            : (p.stock > 10 ? '✅ In Stock' : p.stock > 0 ? `⚠️ Only ${p.stock} left!` : '')}
        </p>` : ''}
         <div style="display:flex;gap:.75rem;margin-bottom:1rem">
          <button onclick="toggleWishlistDetail()"
          id="wishlistDetailBtn"
          style="flex:1;padding:11px;border-radius:var(--radius);border:1.5px solid rgba(201,146,42,.3);background:none;cursor:pointer;font-size:.9rem;font-weight:500;color:var(--text-mid);transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px">
          ${isWishlisted(p.id) ? '❤️ Wishlisted' : '🤍 Add to Wishlist'}
          </button>
          <button onclick="shareCurrentProduct()"
          style="width:46px;height:46px;border-radius:var(--radius);border:1.5px solid rgba(201,146,42,.3);background:none;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .2s"
          title="Share this product">
          🔗
         </button>
        </div>
        ${isSoldOut ? `
          <div style="margin-top:1rem; margin-bottom:1rem">
            <p style="font-size:.82rem;color:var(--text-light);margin-bottom:.75rem;text-align:center">Get notified when back in stock!</p>
            <form onsubmit="notifyMe(event,'${p.id}','${p.name}')" style="display:flex;gap:.75rem">
              <input type="email" placeholder="Your email address" required
                style="flex:1;padding:11px 14px;border:1.5px solid rgba(201,146,42,.25);border-radius:var(--radius);font-size:.875rem;font-family:inherit;outline:none;background:var(--cream)"/>
              <button type="submit" class="btn btn-outline" style="white-space:nowrap;padding:11px 16px;font-size:.85rem">
                Notify Me 🔔
              </button>
            </form>
          </div>` : ''}

        <div class="detail-actions" style="display:flex;gap:1rem;margin-bottom:1.5rem">
          ${isSoldOut
            ? `<button class="btn btn-primary" style="flex:1;justify-content:center;opacity:.5;cursor:not-allowed" disabled>Sold Out</button>`
            : `<button class="btn btn-primary" style="flex:1;justify-content:center" onclick="handleAddToCart()">Add to Cart 🛍️</button>
               <button class="btn btn-outline" onclick="handleBuyNow()">Buy Now →</button>`
          }
        </div>

       
        <div style="background:var(--cream-dark);border-radius:14px;padding:1.25rem">
          <div style="display:flex;flex-direction:column;gap:.6rem">
            <p style="font-size:.85rem;color:var(--text-mid);display:flex;align-items:center;gap:8px">🚚 <span>Free shipping on orders above ₹999</span></p>
            <p style="font-size:.85rem;color:var(--text-mid);display:flex;align-items:center;gap:8px">🔄 <span><a href="/pages/refund.html" style="color:var(--maroon);text-decoration:none">7-day hassle-free returns</a></span></p>
            <p style="font-size:.85rem;color:var(--text-mid);display:flex;align-items:center;gap:8px">💳 <span>UPI, Cards, NetBanking & COD accepted</span></p>
            <p style="font-size:.85rem;color:var(--text-mid);display:flex;align-items:center;gap:8px">🌿 <span>100% pure cotton — skin-friendly fabric</span></p>
          </div>
        </div>
      </div>
    </div>

    <!-- RELATED PRODUCTS -->
    <div style="margin-top:4rem">
      <div class="section-header">
        <p class="section-eyebrow">Explore More</p>
        <h2 class="section-title">You may also like</h2>
      </div>
      <div class="products-grid" id="relatedProducts">
        <div class="skeleton"></div><div class="skeleton"></div>
        <div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </div>
    <div id="recentlyViewedSection"></div>`;

  loadRelated(p.category, p.id);
  renderRecentlyViewed('recentlyViewedSection');
}

function selectSize(size, btn) {
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedSize = size;
  const label = document.querySelector('.size-label');
  if (label) label.innerHTML = `Select Size: <span style="color:var(--maroon);font-weight:700">${size}</span>`;
}

function handleAddToCart() {
  if (!selectedSize) {
    showToast('Please select a size first!', 'error');
    document.querySelector('.size-options')?.animate(
      [{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],
      {duration:300,iterations:2}
    );
    return;
  }
  addToCart(currentProduct, selectedSize);
}

function handleBuyNow() {
  if (!selectedSize) { showToast('Please select a size first!', 'error'); return; }
  addToCart(currentProduct, selectedSize);
  location.href = '/pages/cart.html';
}

async function loadRelated(category, currentId) {
  try {
    const res = await fetch(`${API_URL}/api/products?category=${category}`);
    const data = await res.json();
    const related = (data.products || []).filter(p => p.id !== currentId).slice(0, 4);
    const el = document.getElementById('relatedProducts');
    if (!el) return;
    if (related.length === 0) {
      el.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-light)">No related products found.</p>';
      return;
    }
    el.innerHTML = related.map(p => productCard(p)).join('');
  } catch (err) {
    console.log('Related load error:', err.message);
  }
}

// ── REVIEWS ──────────────────────────────────────────────
async function loadReviews(productId) {
  try {
    const res = await fetch(`${API_URL}/api/reviews/${productId}`);
    const data = await res.json();
    const stars = (n) => '★'.repeat(n) + '☆'.repeat(5 - n);

    document.getElementById('reviewsSection').innerHTML = `
      <div style="margin-top:4rem;padding-bottom:4rem">
        <div class="section-header">
          <p class="section-eyebrow">Customer Reviews</p>
          <h2 class="section-title">What people say</h2>
        </div>

        ${data.total > 0 ? `
        <div style="background:var(--white);border-radius:16px;padding:2rem;margin-bottom:2rem;text-align:center;border:1px solid rgba(201,146,42,.15)">
          <p style="font-size:3.5rem;font-weight:700;color:var(--maroon);line-height:1">${data.average}</p>
          <p style="color:var(--gold);font-size:1.5rem;letter-spacing:4px;margin:.25rem 0">${stars(Math.round(data.average))}</p>
          <p style="color:var(--text-light);font-size:.875rem">Based on ${data.total} review${data.total > 1 ? 's' : ''}</p>
        </div>` : ''}

        <div style="display:flex;flex-direction:column;gap:1rem;margin-bottom:2rem">
          ${data.reviews && data.reviews.length > 0
            ? data.reviews.map(r => `
              <div style="background:var(--white);border-radius:16px;padding:1.5rem;border:1px solid rgba(201,146,42,.12)">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.75rem;flex-wrap:wrap;gap:.5rem">
                  <div style="display:flex;align-items:center;gap:.75rem">
                    <div style="width:40px;height:40px;border-radius:50%;background:var(--maroon);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex-shrink:0">${r.user_name.charAt(0).toUpperCase()}</div>
                    <div>
                      <p style="font-weight:600;color:var(--maroon-dark);margin:0;font-size:.9rem">${r.user_name}</p>
                      <p style="font-size:.75rem;color:var(--text-light);margin:0">${new Date(r.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</p>
                    </div>
                  </div>
                  <span style="color:var(--gold);font-size:1rem;letter-spacing:2px">${stars(r.rating)}</span>
                </div>
                ${r.review ? `<p style="color:var(--text-mid);line-height:1.7;font-size:.9rem;margin:0;font-style:italic">"${r.review}"</p>` : ''}
              </div>`).join('')
            : '<div style="text-align:center;padding:2rem;color:var(--text-light);background:var(--white);border-radius:16px;border:1px solid rgba(201,146,42,.12)"><p style="font-size:2rem;margin-bottom:.5rem">💬</p><p>No reviews yet. Be the first!</p></div>'
          }
        </div>

        <!-- WRITE REVIEW FORM -->
        <div style="background:var(--white);border-radius:20px;padding:2rem;border:1px solid rgba(201,146,42,.15);box-shadow:var(--shadow)">
          <h3 style="font-family:var(--font-display);color:var(--maroon-dark);margin-bottom:1.5rem;font-size:1.3rem">✍️ Write a Review</h3>
          <form id="reviewForm">
            <div class="form-row">
              <div class="form-group"><label>Your Name *</label><input type="text" id="revName" placeholder="Priya Sharma" required/></div>
              <div class="form-group"><label>Email (optional)</label><input type="email" id="revEmail" placeholder="priya@email.com"/></div>
            </div>
            <div class="form-group">
              <label>Rating *</label>
              <div style="display:flex;gap:.25rem;margin-top:.5rem">
                ${[1,2,3,4,5].map(n => `
                  <button type="button" onclick="setRating(${n})" id="star${n}"
                    style="background:none;border:none;font-size:2rem;cursor:pointer;color:#ddd;padding:2px;transition:color .15s;line-height:1">★</button>`).join('')}
              </div>
              <input type="hidden" id="revRating"/>
            </div>
            <div class="form-group"><label>Your Review</label><textarea id="revText" rows="3" placeholder="Share your experience with this kurti..."></textarea></div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Submit Review 💕</button>
          </form>
        </div>
      </div>`;

    // Star rating
    window.setRating = function(n) {
      document.getElementById('revRating').value = n;
      for (let i = 1; i <= 5; i++) {
        document.getElementById(`star${i}`).style.color = i <= n ? '#C9922A' : '#ddd';
      }
    };


    // Review submit
    document.getElementById('reviewForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const rating = document.getElementById('revRating').value;
      if (!rating) { showToast('Please select a rating!', 'error'); return; }
      const btn = e.target.querySelector('button[type="submit"]');
      btn.textContent = 'Submitting...'; btn.disabled = true;
      try {
        const res = await fetch(`${API_URL}/api/reviews`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            product_id: productId,
            user_name: document.getElementById('revName').value,
            user_email: document.getElementById('revEmail').value,
            rating: parseInt(rating),
            review: document.getElementById('revText').value
          })
        });
        const data = await res.json();
        if (data.review) {
          showToast('Review submitted! Thank you 💕');
          loadReviews(productId);
        } else {
          showToast(data.error || 'Please fill all required fields!', 'error');
        }
      } catch (err) {
        showToast('Something went wrong!', 'error');
      }
      btn.textContent = 'Submit Review 💕'; btn.disabled = false;
    });

  } catch (err) {
    console.log('Reviews error:', err.message);
  }
}
function shareCurrentProduct() {
  const link = window.location.href;
  const name = currentProduct?.name || 'Sakhi Kurti';

  if (navigator.share) {
    navigator.share({
      title: `${name} – Sakhi.co`,
      text: `Check out this beautiful kurti from Sakhi.co! 👗`,
      url: link
    }).catch(() => copyLink(link));
  } else {
    copyLink(link);
  }
}

function copyLink(text) {
  navigator.clipboard.writeText(text).then(() => {
    showToast('🔗 Link copied! Share with your friends.');
  }).catch(() => {
    const el = document.createElement('textarea');
    el.value = text;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    showToast('🔗 Link copied!');
  });
}
function toggleWishlistDetail() {
  const btn = document.getElementById('wishlistDetailBtn');
  const p = currentProduct;
  const wished = isWishlisted(p.id);

  const wishlist = getWishlist();
  if (wished) {
    const idx = wishlist.findIndex(w => w.id === p.id);
    wishlist.splice(idx, 1);
    saveWishlist(wishlist);
    btn.innerHTML = '🤍 Add to Wishlist';
    showToast('Removed from wishlist');
  } else {
    wishlist.push({ id: p.id, name: p.name, price: p.price, image: p.images?.[0] || '' });
    saveWishlist(wishlist);
    btn.innerHTML = '❤️ Wishlisted';
    showToast('Added to wishlist ❤️');
  }
}

function shareCurrentProduct() {
  const link = window.location.href;
  const name = currentProduct?.name || 'Sakhi Kurti';
  if (navigator.share) {
    navigator.share({ title: `${name} – Sakhi.co`, text: 'Check out this beautiful kurti! 👗', url: link })
      .catch(() => copyLink(link));
  } else {
    copyLink(link);
  }
}

function copyLink(text) {
  navigator.clipboard.writeText(text).then(() => {
    showToast('🔗 Link copied! Share with your friends.');
  }).catch(() => {
    const el = document.createElement('textarea');
    el.value = text;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    showToast('🔗 Link copied!');
  });
}
function notifyMe(e, productId, productName) {
  e.preventDefault();
  const email = e.target.querySelector('input[type="email"]').value;
  // Save to localStorage for now
  let notifications = JSON.parse(localStorage.getItem('sakhi_notify') || '[]');
  notifications.push({ productId, productName, email, date: new Date() });
  localStorage.setItem('sakhi_notify', JSON.stringify(notifications));
  showToast('✅ We will notify you when back in stock!');
  e.target.reset();
}
document.addEventListener('DOMContentLoaded', loadProduct);
</script>
<!-- BACK TO TOP -->
<button id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})"
  style="display:none;position:fixed;bottom:2rem;right:2rem;width:46px;height:46px;border-radius:50%;background:var(--maroon);color:white;border:none;cursor:pointer;font-size:1.2rem;box-shadow:var(--shadow-lg);z-index:400;align-items:center;justify-content:center;transition:all .3s">
  ↑
</button>
<script>
window.addEventListener('scroll', () => {
  const btn = document.getElementById('backToTop');
  if (btn) btn.style.display = window.scrollY > 400 ? 'flex' : 'none';
});
</script>
<!-- STICKY ADD TO CART -->
<div id="stickyCart" style="display:none;position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid rgba(201,146,42,.2);padding:1rem 1.5rem;z-index:400;box-shadow:0 -4px 20px rgba(123,28,46,.1)">
  <div style="max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap">
    <div id="stickyProductName" style="font-family:var(--font-display);font-weight:600;color:var(--maroon-dark);font-size:.95rem"></div>
    <div style="display:flex;align-items:center;gap:1rem">
      <span id="stickyPrice" style="font-weight:700;color:var(--maroon);font-size:1.1rem"></span>
      <button onclick="handleAddToCart()" class="btn btn-primary" style="padding:10px 24px;font-size:.875rem">
        Add to Cart 🛍️
      </button>
    </div>
  </div>
</div>

<script>
window.addEventListener('scroll', () => {
  const sticky = document.getElementById('stickyCart');
  const detailSection = document.querySelector('.product-detail-grid');
  if (!sticky || !detailSection) return;
  const rect = detailSection.getBoundingClientRect();
  if (rect.bottom < 0) {
    sticky.style.display = 'block';
    if (currentProduct) {
      document.getElementById('stickyProductName').textContent = currentProduct.name;
      document.getElementById('stickyPrice').textContent = `₹${currentProduct.price}`;
    }
  } else {
    sticky.style.display = 'none';
  }
});
</script>
</body>
</html>
