<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Forgot Password – Sakhi.co</title>
<link rel="stylesheet" href="../css/style.css"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
</head>
<body>
  <div id="pageTransition"><img src="../images/logo.jpeg" alt="Loading"/></div>
<div class="auth-page">
  <div class="auth-box">
    <div class="logo-wrap">
      <img src="../images/logo.jpeg" alt="Sakhi"/>
    </div>
    <h2>Forgot Password?</h2>
    <p class="sub">Enter your email — we'll send you a reset link!</p>

    <div id="successMsg" style="display:none;background:#d1e7dd;border-radius:12px;padding:1rem;text-align:center;margin-bottom:1.5rem">
      <p style="color:#0a3622;font-weight:600">✅ Reset link sent!</p>
      <p style="color:#0a3622;font-size:.875rem">Check your email inbox.</p>
    </div>

    <form id="forgotForm">
      <div class="form-group">
        <label>Email Address *</label>
        <input type="email" id="forgotEmail" placeholder="priya@email.com" required/>
      </div>
      <p id="forgotError" style="color:#c0392b;font-size:.82rem;margin-bottom:.75rem;display:none"></p>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:14px">
        Send Reset Link →
      </button>
    </form>

    <div class="auth-divider"><span>Remember password?</span></div>
    <a href="/pages/login.html" class="btn btn-outline" style="width:100%;justify-content:center">
      Back to Login
    </a>
  </div>
</div>

<script src="../js/config.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.textContent = 'Sending...'; btn.disabled = true;

  try {
    const res = await fetch(`${API_URL}/api/users/forgot-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('forgotEmail').value })
    });
    const data = await res.json();

    document.getElementById('forgotForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  } catch(err) {
    document.getElementById('forgotError').textContent = 'Something went wrong!';
    document.getElementById('forgotError').style.display = 'block';
  }

  btn.textContent = 'Send Reset Link →'; btn.disabled = false;
});
</script>
<script src="../js/festival.js"></script>
</body>
</html>
