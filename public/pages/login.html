<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Login – Sakhi.co</title>
<link rel="stylesheet" href="../css/style.css"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-R0VWP57W8J"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-R0VWP57W8J');
</script>
</head>
<body>

<div class="auth-page">
  <div class="auth-box">
    <div class="logo-wrap">
      <img src="../images/logo.jpeg" alt="Sakhi"/>
    </div>
    <h2>Welcome Back!</h2>
    <p class="sub">Sign in to your Sakhi.co account</p>

    <!-- LOGIN FORM -->
    <div id="loginSection">
      <form id="loginForm">
        <div class="form-group">
          <label>Email *</label>
          <input type="email" id="loginEmail" placeholder="priya@email.com" required/>
        </div>
        <div class="form-group">
          <label>Password *</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required/>
        </div>
        <p id="loginError" style="color:#c0392b;font-size:.82rem;margin-bottom:.75rem;display:none"></p>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:14px">
          Sign In →
        </button>
      </form>
      <div class="auth-divider"><span>Don't have an account?</span></div>
      <button class="btn btn-outline" style="width:100%;justify-content:center" onclick="showRegister()">
        Create Account
      </button>
    </div>
    <div style="text-align:right;margin-top:-.5rem;margin-bottom:1rem">
      <a href="/pages/forgot-password.html" style="font-size:.82rem;color:var(--maroon);text-decoration:none">
        Forgot password?
      </a>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerSection" style="display:none">
      <form id="registerForm">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="regName" placeholder="Priya Sharma" required/>
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input type="email" id="regEmail" placeholder="priya@email.com" required/>
        </div>
        <div class="form-group">
          <label>Phone *</label>
          <input type="tel" id="regPhone" placeholder="+91 98765 43210" required/>
        </div>
        <div class="form-group">
          <label>Password *</label>
          <input type="password" id="regPassword" placeholder="Min 6 characters" required/>
        </div>
        <p id="regError" style="color:#c0392b;font-size:.82rem;margin-bottom:.75rem;display:none"></p>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:14px">
          Create Account →
        </button>
      </form>
      <div class="auth-divider"><span>Already have an account?</span></div>
      <button class="btn btn-outline" style="width:100%;justify-content:center" onclick="showLogin()">
        Sign In
      </button>
    </div>

  </div>
</div>

<script src="../js/config.js"></script>
<script>
// Redirect if already logged in
if (localStorage.getItem('sakhi_user_token')) {
  location.href = '/';
}

function showRegister() {
  document.getElementById('loginSection').style.display = 'none';
  document.getElementById('registerSection').style.display = 'block';
}

function showLogin() {
  document.getElementById('registerSection').style.display = 'none';
  document.getElementById('loginSection').style.display = 'block';
}

// LOGIN
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]');
  btn.textContent = 'Signing in...'; btn.disabled = true;
  const errEl = document.getElementById('loginError');

  try {
    const res = await fetch(`${API_URL}/api/users/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value
      })
    });
    const data = await res.json();
    if (data.token) {
      localStorage.setItem('sakhi_user', JSON.stringify(data.user));
      localStorage.setItem('sakhi_user_token', data.token);
      // Redirect to previous page or home
      const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
      location.href = redirect;
    } else {
      errEl.textContent = data.error || 'Login failed!';
      errEl.style.display = 'block';
    }
  } catch (err) {
    errEl.textContent = 'Something went wrong!';
    errEl.style.display = 'block';
  }
  btn.textContent = 'Sign In →'; btn.disabled = false;
});

// REGISTER
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]');
  btn.textContent = 'Creating...'; btn.disabled = true;
  const errEl = document.getElementById('regError');

  try {
    const res = await fetch(`${API_URL}/api/users/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('regName').value,
        email: document.getElementById('regEmail').value,
        phone: document.getElementById('regPhone').value,
        password: document.getElementById('regPassword').value
      })
    });
    const data = await res.json();
    if (data.token) {
      localStorage.setItem('sakhi_user', JSON.stringify(data.user));
      localStorage.setItem('sakhi_user_token', data.token);
      const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
      location.href = redirect;
    } else {
      errEl.textContent = data.error || 'Registration failed!';
      errEl.style.display = 'block';
    }
  } catch (err) {
    errEl.textContent = 'Something went wrong!';
    errEl.style.display = 'block';
  }
  btn.textContent = 'Create Account →'; btn.disabled = false;
});
</script>
<!-- BACK TO TOP -->
<button id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})"
  style="display:none;position:fixed;bottom:2rem;right:2rem;width:46px;height:46px;border-radius:50%;background:var(--maroon);color:white;border:none;cursor:pointer;font-size:1.2rem;box-shadow:var(--shadow-lg);z-index:400;align-items:center;justify-content:center;transition:all .3s">
  ↑
</button>
<script>
window.addEventListener('scroll', () => {
  const btn = document.getElementById('backToTop');
  if (btn) btn.style.display = window.scrollY > 400 ? 'flex' : 'none';
});
</script>
<script src="../js/festival.js"></script>
</body>
</html>
