<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Reset Password – Sakhi.co</title>
<link rel="stylesheet" href="../css/style.css"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="logo-wrap">
      <img src="../images/logo.jpeg" alt="Sakhi"/>
    </div>
    <h2>Reset Password</h2>
    <p class="sub">Enter your new password below</p>

    <div id="successMsg" style="display:none;background:#d1e7dd;border-radius:12px;padding:1rem;text-align:center;margin-bottom:1.5rem">
      <p style="color:#0a3622;font-weight:600">✅ Password reset successful!</p>
      <a href="/pages/login.html" class="btn btn-primary" style="margin-top:1rem;display:inline-flex">Login Now →</a>
    </div>

    <form id="resetForm">
      <div class="form-group">
        <label>New Password *</label>
        <input type="password" id="newPassword" placeholder="Min 6 characters" minlength="6" required/>
      </div>
      <div class="form-group">
        <label>Confirm Password *</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter password" required/>
      </div>
      <p id="resetError" style="color:#c0392b;font-size:.82rem;margin-bottom:.75rem;display:none"></p>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:14px">
        Reset Password →
      </button>
    </form>
  </div>
</div>

<script src="../js/config.js"></script>
<script>
const token = new URLSearchParams(window.location.search).get('token');
if (!token) location.href = '/pages/login.html';

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const newPass = document.getElementById('newPassword').value;
  const confirmPass = document.getElementById('confirmPassword').value;
  const errEl = document.getElementById('resetError');

  if (newPass !== confirmPass) {
    errEl.textContent = 'Passwords do not match!';
    errEl.style.display = 'block';
    return;
  }

  const btn = e.target.querySelector('button');
  btn.textContent = 'Resetting...'; btn.disabled = true;

  try {
    const res = await fetch(`${API_URL}/api/users/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: newPass })
    });
    const data = await res.json();

    if (data.message) {
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    } else {
      errEl.textContent = data.error || 'Something went wrong!';
      errEl.style.display = 'block';
    }
  } catch(err) {
    errEl.textContent = 'Something went wrong!';
    errEl.style.display = 'block';
  }

  btn.textContent = 'Reset Password →'; btn.disabled = false;
});
</script>
</body>
</html>
