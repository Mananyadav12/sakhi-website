<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Order Confirmed – Sakhi.co</title>
<link rel="stylesheet" href="../css/style.css"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-R0VWP57W8J"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-R0VWP57W8J');
</script>
</head>
<body>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--cream)">
  <div style="text-align:center;max-width:500px;background:white;border-radius:24px;padding:3rem 2.5rem;box-shadow:var(--shadow-lg)">
    <div style="font-size:4rem;margin-bottom:1rem">🎉</div>
    <h1 style="font-family:var(--font-display);color:var(--maroon-dark);margin-bottom:.75rem">Order Confirmed!</h1>
    <p style="color:var(--text-mid);line-height:1.7;margin-bottom:2rem">Thank you for shopping with Sakhi.co! Your order has been placed and a confirmation email has been sent to you.</p>
    <div style="background:var(--cream);border-radius:14px;padding:1.5rem;margin-bottom:2rem;text-align:left">
      <p style="font-size:.82rem;font-weight:600;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:.75rem">Order Details</p>
      <p style="margin-bottom:.5rem"><strong>Order #:</strong> <span id="orderNum">—</span></p>
      <p><strong>Tracking ID:</strong> <span id="trackId" style="color:var(--maroon);font-weight:600">—</span></p>
    </div>
    <p style="font-size:.85rem;color:var(--text-light);margin-bottom:2rem">Save your tracking ID to track your order anytime!</p>
    <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap">
      <a href="/pages/track.html" class="btn btn-primary">Track Order</a>
      <a href="/" class="btn btn-outline">Continue Shopping</a>
    </div>
  </div>
</div>
<script src="../js/config.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById('orderNum').textContent = params.get('order') || '—';
  document.getElementById('trackId').textContent = params.get('tracking') || '—';
</script>
<!-- BACK TO TOP -->
<button id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})"
  style="display:none;position:fixed;bottom:2rem;right:2rem;width:46px;height:46px;border-radius:50%;background:var(--maroon);color:white;border:none;cursor:pointer;font-size:1.2rem;box-shadow:var(--shadow-lg);z-index:400;align-items:center;justify-content:center;transition:all .3s">
  ↑
</button>
<script>
window.addEventListener('scroll', () => {
  const btn = document.getElementById('backToTop');
  if (btn) btn.style.display = window.scrollY > 400 ? 'flex' : 'none';
});
</script>
</body>
</html>
