<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>My Profile – Sakhi.co</title>
<link rel="stylesheet" href="../css/style.css"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-R0VWP57W8J"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-R0VWP57W8J');
</script>
</head>
<body>

<nav class="navbar" id="navbar">
  <div class="nav-container">
    <a href="/" class="nav-logo">
      <img src="../images/logo.jpeg" alt="Sakhi" class="logo-img"/>
      <span class="brand-name">sakhi.co</span>
    </a>
    <ul class="nav-links" id="navLinks">
      <li><a href="/">Home</a></li>
      <li><a href="/pages/collections.html">Collections</a></li>
    </ul>
    <div class="nav-actions">
      <div id="authBtn"></div>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </div>
  </div>
</nav>

<div class="page-hero" style="padding:140px 2rem 4rem">
  <p class="hero-eyebrow">My Account</p>
  <h1>My Profile</h1>
</div>

<div class="container" style="padding:3rem 2rem 6rem">
  <div style="display:grid;grid-template-columns:300px 1fr;gap:2rem;align-items:start">

    <!-- Sidebar -->
    <div>
      <div style="background:var(--white);border-radius:20px;padding:1.5rem;border:1px solid rgba(201,146,42,.15);margin-bottom:1rem">
        <div style="text-align:center;padding-bottom:1.25rem;border-bottom:1px solid rgba(201,146,42,.1)">
          <div id="profileAvatar" style="width:70px;height:70px;border-radius:50%;background:var(--maroon);color:white;font-size:1.8rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem"></div>
          <p id="profileName" style="font-family:var(--font-display);font-weight:600;color:var(--maroon-dark);font-size:1.1rem;margin-bottom:.25rem"></p>
          <p id="profileEmail" style="color:var(--text-light);font-size:.82rem"></p>
        </div>
        <nav style="margin-top:1rem">
          <a href="/pages/profile.html" style="display:flex;align-items:center;gap:10px;padding:.85rem 1rem;border-radius:10px;background:var(--cream);color:var(--maroon);font-size:.875rem;font-weight:600;text-decoration:none;margin-bottom:.5rem">
            👤 My Profile
          </a>
          <a href="/pages/my-orders.html" style="display:flex;align-items:center;gap:10px;padding:.85rem 1rem;border-radius:10px;color:var(--text-mid);font-size:.875rem;text-decoration:none;margin-bottom:.5rem;transition:background .2s"
            onmouseover="this.style.background='var(--cream)'" onmouseout="this.style.background='none'">
            📦 My Orders
          </a>
          <a href="/pages/wishlist.html" style="display:flex;align-items:center;gap:10px;padding:.85rem 1rem;border-radius:10px;color:var(--text-mid);font-size:.875rem;text-decoration:none;margin-bottom:.5rem;transition:background .2s"
            onmouseover="this.style.background='var(--cream)'" onmouseout="this.style.background='none'">
            ❤️ My Wishlist
          </a>
          <button onclick="logoutUser()" style="width:100%;display:flex;align-items:center;gap:10px;padding:.85rem 1rem;border-radius:10px;color:#c0392b;font-size:.875rem;background:none;border:none;cursor:pointer;text-align:left;transition:background .2s"
            onmouseover="this.style.background='#fff5f5'" onmouseout="this.style.background='none'">
            🚪 Logout
          </button>
        </nav>
      </div>

      <!-- Loyalty Points -->
      <div style="background:var(--maroon);border-radius:20px;padding:1.5rem;text-align:center">
        <p style="color:rgba(255,255,255,.7);font-size:.78rem;margin-bottom:.5rem;letter-spacing:1px;text-transform:uppercase">Loyalty Points</p>
        <p id="loyaltyPoints" style="color:var(--gold-light);font-size:2.5rem;font-weight:700;margin:0">—</p>
        <p id="loyaltyValue" style="color:rgba(255,255,255,.6);font-size:.82rem;margin:.25rem 0 1rem">= ₹0 discount</p>
        <p id="totalOrders" style="color:rgba(255,255,255,.7);font-size:.78rem">0 orders placed</p>
        <div style="margin-top:1rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.1)">
          <p style="color:rgba(255,255,255,.5);font-size:.72rem">Every ₹10 = 1 point • 10 points = ₹1 off</p>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div>
      <!-- Edit Profile -->
      <div style="background:var(--white);border-radius:20px;padding:2rem;border:1px solid rgba(201,146,42,.15);margin-bottom:1.5rem">
        <h3 style="font-family:var(--font-display);color:var(--maroon-dark);margin-bottom:1.5rem">Edit Profile</h3>
        <form id="profileForm">
          <div class="form-row">
            <div class="form-group"><label>Full Name</label><input type="text" id="editName" placeholder="Your name"/></div>
            <div class="form-group"><label>Phone</label><input type="tel" id="editPhone" placeholder="+91 98765 43210"/></div>
          </div>
          <div class="form-group"><label>Address</label><input type="text" id="editAddress" placeholder="House No, Street, Area"/></div>
          <div class="form-row">
            <div class="form-group"><label>City</label><input type="text" id="editCity" placeholder="Indore"/></div>
            <div class="form-group"><label>State</label><input type="text" id="editState" placeholder="Madhya Pradesh"/></div>
          </div>
          <div class="form-group"><label>Pincode</label><input type="text" id="editPincode" placeholder="452001" maxlength="6"/></div>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
      </div>

      <!-- Recent Transactions -->
      <div style="background:var(--white);border-radius:20px;padding:2rem;border:1px solid rgba(201,146,42,.15)">
        <h3 style="font-family:var(--font-display);color:var(--maroon-dark);margin-bottom:1.5rem">Points History</h3>
        <div id="loyaltyHistory"></div>
      </div>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:1px solid rgba(255,255,255,.1);padding-top:1.25rem">
      <p>© 2026 Sakhi.co</p><p>Made with ❤️ in India</p>
    </div>
  </div>
</footer>

<script src="../js/config.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/main.js"></script>
<script src="../js/auth.js"></script>
<script>
const token = localStorage.getItem('sakhi_user_token');
if (!token) location.href = '/pages/login.html?redirect=/pages/profile.html';

async function loadProfile() {
  try {
    const res = await fetch(`${API_URL}/api/users/profile`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    const data = await res.json();
    const user = data.user;

    document.getElementById('profileAvatar').textContent = user.name.charAt(0).toUpperCase();
    document.getElementById('profileName').textContent = user.name;
    document.getElementById('profileEmail').textContent = user.email;
    document.getElementById('editName').value = user.name || '';
    document.getElementById('editPhone').value = user.phone || '';
    document.getElementById('editAddress').value = user.address || '';
    document.getElementById('editCity').value = user.city || '';
    document.getElementById('editState').value = user.state || '';
    document.getElementById('editPincode').value = user.pincode || '';
  } catch(err) {
    console.log('Profile error:', err.message);
  }
}

async function loadLoyalty() {
  try {
    const res = await fetch(`${API_URL}/api/users/loyalty`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    const data = await res.json();

    document.getElementById('loyaltyPoints').textContent = data.points || 0;
    document.getElementById('loyaltyValue').textContent = `= ₹${data.value || 0} discount`;
    document.getElementById('totalOrders').textContent = `${data.total_orders || 0} orders placed`;

    const histEl = document.getElementById('loyaltyHistory');
    if (!data.transactions || data.transactions.length === 0) {
      histEl.innerHTML = '<p style="color:var(--text-light);text-align:center;padding:1.5rem">No transactions yet. Place an order to earn points!</p>';
      return;
    }

    histEl.innerHTML = data.transactions.map(t => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:.75rem 0;border-bottom:1px solid rgba(201,146,42,.1)">
        <div>
          <p style="font-size:.875rem;color:var(--text-dark);margin:0 0 2px">${t.description}</p>
          <p style="font-size:.75rem;color:var(--text-light);margin:0">${new Date(t.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</p>
        </div>
        <span style="font-weight:700;color:${t.type==='earned'?'#2D8A4E':'#c0392b'};font-size:.95rem">
          ${t.type==='earned'?'+':'-'}${Math.abs(t.points)} pts
        </span>
      </div>`).join('');
  } catch(err) {
    console.log('Loyalty error:', err.message);
  }
}

document.getElementById('profileForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.textContent = 'Saving...'; btn.disabled = true;
  try {
    await fetch(`${API_URL}/api/users/profile`, {
      method: 'PUT',
      headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('editName').value,
        phone: document.getElementById('editPhone').value,
        address: document.getElementById('editAddress').value,
        city: document.getElementById('editCity').value,
        state: document.getElementById('editState').value,
        pincode: document.getElementById('editPincode').value
      })
    });
    showToast('✅ Profile updated!');
    const user = JSON.parse(localStorage.getItem('sakhi_user') || '{}');
    user.name = document.getElementById('editName').value;
    localStorage.setItem('sakhi_user', JSON.stringify(user));
  } catch(err) {
    showToast('Something went wrong!', 'error');
  }
  btn.textContent = 'Save Changes'; btn.disabled = false;
});

document.addEventListener('DOMContentLoaded', () => {
  loadProfile();
  loadLoyalty();
});
</script>
</body>
</html>
